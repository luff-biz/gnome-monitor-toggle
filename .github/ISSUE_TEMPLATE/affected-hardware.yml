name: Report affected hardware
description: You hit "flip_done timed out" without a GPU reset — tell us what you run
title: "[hardware] "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The root cause is **not established**. The
        failure surfaces in amdgpu's display code, but the only machine it has
        been reproduced on drives its monitors through a Thunderbolt dock,
        over MST, with DSC, on a bandwidth-saturated USB4 link — so the driver
        may not be the culprit at all.

        The single most valuable report right now is one where the monitor is
        **connected directly, without a dock**. That would separate the two
        hypotheses. Every data point helps, **including negative ones**.

  - type: textarea
    id: specs
    attributes:
      label: System information
      description: |
        Run this from the repository directory and paste the output below.
        It prints machine model, kernel, GPU, monitor models and the matching
        log lines — nothing secret. Read it first if you would rather check.

        ```bash
        {
          echo "### System"
          . /etc/os-release && echo "Distro:  $NAME $VERSION"
          echo "Kernel:  $(uname -r)"
          echo "CPU:     $(lscpu | sed -n 's/^Model name: *//p' | sed 's/^ *//')"
          echo "GPU:     $(lspci -nn | grep -iE 'VGA|Display|3D' | cut -d' ' -f2-)"
          echo "Machine: $(cat /sys/class/dmi/id/sys_vendor) $(cat /sys/class/dmi/id/product_name)"
          echo "BIOS:    $(cat /sys/class/dmi/id/bios_version) $(cat /sys/class/dmi/id/bios_date)"
          echo "Session: ${XDG_SESSION_TYPE:-unknown} / $(gnome-shell --version)"
          echo
          echo "### Monitors and modes"
          ./monitor-toggle.sh --list
          gdctl show 2>/dev/null | grep -E "Monitor |[0-9]+x[0-9]+@" | sed 's/^ *//'
          echo
          echo "### Dock / link (empty means no Thunderbolt/USB4 dock)"
          command -v boltctl >/dev/null \
            && boltctl list 2>/dev/null | grep -E "^ \*|generation:|rx speed:|tx speed:" \
            || echo "  boltctl not installed"
          echo
          echo "### MST / DSC / link events"
          journalctl -b 0 -k 2>/dev/null \
            | grep -iE "MST_DSC|dsc precompute|link training|dp_mst|HPD RX IRQ" | tail -5
          echo
          echo "### Freeze signature (previous boot)"
          journalctl -b -1 -k 2>/dev/null \
            | grep -E "flip_done|GPU reset|ring .*timeout" | tail -10
        }
        ```
      render: shell
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: How is the affected display connected?
      description: The most important question in this whole report.
      options:
        - "Directly to the machine (no dock, no hub)"
        - "Through a Thunderbolt / USB4 dock"
        - "Through a USB-C hub or DisplayPort-Alt adapter"
        - "Through an MST hub or daisy chain"
        - "Internal panel only"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: helped
    attributes:
      label: Did toggling the monitor clear the freeze?
      options:
        - "Yes — the picture came back"
        - "No — the freeze persisted"
        - "Partly / not every time"
        - "Have not been able to try yet"
    validations:
      required: true

  - type: input
    id: displays
    attributes:
      label: Displays, resolution and refresh rate
      description: How many displays, and at what mode. Bandwidth is a suspect.
      placeholder: 'e.g. 2 x 3840x2160@120, plus internal panel disabled'
    validations:
      required: false

  - type: checkboxes
    id: conditions
    attributes:
      label: Which of these apply to your setup?
      options:
        - label: Internal panel disabled (lid closed / turned off)
        - label: DSC or MST mentioned in the kernel log
        - label: Happens after suspend/resume
        - label: Happens on an idle/blanked screen
        - label: Only ever seen on the internal panel
        - label: Lowering resolution or refresh rate changed the frequency

  - type: textarea
    id: frequency
    attributes:
      label: How often, and does anything trigger it?
      placeholder: |
        e.g. "roughly once a day, usually after the screen has been idle for a
        while" — or "only when I unplug the dock". If you have found no
        pattern, say so; that is useful too.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      placeholder: |
        Kernel versions you have tried, whether an older kernel was fine,
        BIOS updates, workarounds that did or did not help.
    validations:
      required: false
